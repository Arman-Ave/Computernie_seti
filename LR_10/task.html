<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма регистрации</title>
</head>
<body bgcolor="#f2f2f2">

    <center>
        <h2>Форма регистрации</h2>
    </center>

    <form action="#" method="post">
        <table align="center" cellpadding="8">
            <tr>
                <td align="right">Имя</td>
                <td><input type="text" name="name" size="35"></td>
            </tr>

            <tr>
                <td align="right">e-mail</td>
                <td><input type="email" name="email" size="35"></td>
            </tr>

            <tr>
                <td align="right">Пароль</td>
                <td><input type="password" name="password" size="35"></td>
            </tr>

            <tr>
                <td align="right">Повтор пароля</td>
                <td><input type="password" name="password2" size="35"></td>
            </tr>

            <tr>
                <td align="right">Пол</td>
                <td>
                    <input type="radio" name="gender" value="male" checked> мужской
                    <input type="radio" name="gender" value="female"> женский
                </td>
            </tr>

            <tr>
                <td align="right" valign="top">Увлечения</td>
                <td>
                    <select name="hobby" size="7" multiple>
                        <option>компьютеры</option>
                        <option>спорт</option>
                        <option>игры</option>
                        <option>животные</option>
                        <option>автомобили</option>
                        <option>клубы</option>
                        <option>музыка</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td align="right" valign="top">Ваши пожелания</td>
                <td>
                    <textarea name="wishes" rows="5" cols="37"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td align="right">
                    <input type="submit" value="Отправить">
                    <input type="reset" value="Очистить">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
